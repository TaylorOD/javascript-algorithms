name: Generate constrained dependency lockfile refresh
on:
  pull_request:
    paths:
      - .github/workflows/branch-lockfile-update.yml
permissions:
  contents: write
jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'security/dependency-chain-audit-20261023'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global npm@6.14.18
      - name: Update lockfile only, without major upgrades or install scripts
        run: |
          npm audit fix --package-lock-only --ignore-scripts --no-fund --no-progress || echo 'Some advisories require major upgrades'
          git diff --stat -- package-lock.json
      - name: Commit constrained lockfile refresh to this branch only
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'No supported lockfile upgrades available'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Refresh vulnerable dependency lockfile versions within existing constraints'
          git push origin HEAD:refs/heads/security/dependency-chain-audit-20261023
