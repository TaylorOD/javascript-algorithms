name: Generate modern dependency lockfile
on:
  pull_request:
    paths:
      - .github/workflows/temporary-lockfile-migration.yml
permissions:
  contents: write
jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'security/modernize-test-lint-toolchain-20261106'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit only regenerated lockfile to PR branch
        run: |
          git diff --stat -- package-lock.json
          if git diff --quiet -- package-lock.json; then
            echo "No dependency lockfile changes"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Regenerate lockfile for modern secure tooling'
          git push origin HEAD:refs/heads/security/modernize-test-lint-toolchain-20261106
