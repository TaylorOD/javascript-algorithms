name: Refresh Jest 29 security lockfile
on:
  pull_request:
    paths:
      - .github/workflows/temporary-jest-lockfile.yml
permissions:
  contents: write
jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'security/modernize-test-lint-toolchain-20261106'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve compatible Jest dependencies
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
      - name: Push updated lockfile to this PR only
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Resolve patched Jest and ESLint transitive dependencies'
          git push origin HEAD:refs/heads/security/modernize-test-lint-toolchain-20261106
